database:
  serverName: localhost
  port: 3306
  user: root
  password: password
  schema: crm-db

spring:
  application:
    name: crm-api
  datasource:
    url: jdbc:mysql://${database.serverName}:${database.port}/${database.schema}
    username: "${database.user}"
    password: "${database.password}"
    hikari:
      maximumPoolSize: 50
      maxLifeTime: 840000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        ##dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/schema, classpath:db/migration/data
    validate-on-migration: true